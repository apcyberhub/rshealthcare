<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>R.S. Health Care Service</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // string into just a query string, then redirects the browser
      // to the new URL with only a query string and hash fragment.
      
      // If deployed as https://USERNAME.github.io/REPO-NAME/, pathSegmentsToKeep = 1
      // If deployed as custom domain https://example.com/, pathSegmentsToKeep = 0
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var pathSegments = l.pathname.slice(1).split('/');
      
      // Auto-detect if root or repo path
      if (pathSegments.length > 0 && pathSegments[0] === '') {
        pathSegmentsToKeep = 0;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #050505; color: #D4A72C; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to R.S. Health Care Service...</p>
  </body>
</html>
